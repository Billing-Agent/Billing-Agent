name: CI

"on":
  pull_request:
    branches:
      - main
  push:
    branches:
      - Dev

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Ephemeral CI-only values for the disposable PostgreSQL service and JWT tests.
      DATABASE_URL: postgresql+asyncpg://billing_test:billing_test_password@localhost:5432/billing_agent_test
      BILLING_TEST_DATABASE_URL: postgresql+asyncpg://billing_test:billing_test_password@localhost:5432/billing_agent_test
      JWT_SECRET: ci-only-jwt-secret-not-for-production

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: billing_test
          POSTGRES_PASSWORD: billing_test_password
          POSTGRES_DB: billing_agent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U billing_test -d billing_agent_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Apply database migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Run backend test suite
        working-directory: backend
        run: pytest -q

  flutter:
    name: Flutter analyze and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Analyze Flutter
        working-directory: mobile
        run: flutter analyze

      - name: Run Flutter test suite
        working-directory: mobile
        run: flutter test
